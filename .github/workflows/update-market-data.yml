name: Update market close data

on:
  workflow_dispatch:
  schedule:
    # 18:30 Asia/Shanghai (UTC+8), Monday through Friday.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-close-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch completed market closes
        run: npm run update:market

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Check for new market data
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- app/marketHistory.ts; then
            echo "No file changes detected. Skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            update_date="$(git diff --unified=0 -- app/marketHistory.ts | grep '^+' | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1)"
            echo "Market history changed. Preparing commit."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "update_date=${update_date}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated closes
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_DATE: ${{ steps.changes.outputs.update_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/marketHistory.ts
          git commit -m "data: update market close ${UPDATE_DATE}"
          echo "Committed market update for ${UPDATE_DATE}."

      - name: Push updated closes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin HEAD:main
          echo "Pushed market update to main."
